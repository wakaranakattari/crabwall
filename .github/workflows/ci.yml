name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude crabwall-ebpf --all-targets -- -D warnings
      - run: cargo test --workspace --exclude crabwall-ebpf
      - name: sh syntax
        run: |
          for f in packaging/install.sh \
              packaging/runit/crabwalld/run \
              packaging/runit/crabwalld/log-run \
              packaging/openrc/crabwalld \
              packaging/s6/crabwalld/run \
              packaging/sysvinit/crabwalld \
              packaging/tests/verify-*.sh; do
            sh -n "$f" || exit 1
          done

  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - run: cargo run -p xtask -- build-ebpf

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      - run: cargo +nightly fuzz build
        working-directory: fuzz
      - run: cargo +nightly fuzz run dns -- -max_total_time=120
        working-directory: fuzz
      - run: cargo +nightly fuzz run sni -- -max_total_time=120
        working-directory: fuzz
      - run: cargo +nightly fuzz run frame -- -max_total_time=120
        working-directory: fuzz

  packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            init: systemd
          - image: debian:12-slim
            init: sysvinit
          - image: alpine:latest
            init: openrc
          - image: alpine:latest
            init: runit
          - image: alpine:latest
            init: s6
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: supervisor deps
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache runit s6 openrc 2>/dev/null || apk add --no-cache runit s6
          fi
          # The ubuntu image ships no systemd userland: install it so the
          # unit file path can be verified offline (no daemon runs here).
          if [ "${{ matrix.init }}" = systemd ]; then
            apt-get update && apt-get install -y systemd
          fi
          mkdir -p /var/service
        # runit_service_dir() prefers /var/service once it exists; harmless
        # for the other inits.
      - name: stub binaries
        # Stand-in for the real crabwalld: a supervised `sleep` proves the
        # service definitions work end to end. Plain `sleep N`, not
        # `sleep infinity`: the latter is GNU-only and dies instantly
        # under busybox (Alpine), sending the supervisor into a crash loop.
        run: |
          printf '#!/bin/sh\nexec sleep 2147483647\n' > /usr/local/bin/crabwalld
          printf '#!/bin/sh\necho stub\n' > /usr/local/bin/crabwall
          chmod +x /usr/local/bin/crabwalld /usr/local/bin/crabwall
      - name: install service files
        run: |
          export CRABWALL_INIT="${{ matrix.init }}"
          export SCANDIR="/tmp/s6-scan"
          ./packaging/install.sh --services-only --no-start
      - name: verify
        run: |
          export SCANDIR="/tmp/s6-scan"
          ./packaging/tests/verify-${{ matrix.init }}.sh
