[package]
name = "crabwalld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Little Snitch for Linux: per-app firewall daemon"

[[bin]]
name = "crabwalld"
path = "src/main.rs"

[dependencies]
crabwall-common = { version = "1.0.0", path = "../crabwall-common" }
crabwall-packet.workspace = true
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
toml.workspace = true
directories.workspace = true
chrono.workspace = true
uuid.workspace = true
aya = { version = "0.12", features = ["async_tokio"] }
dns-lookup = "2"
bytes = "1"

[dev-dependencies]
crabwall-packet = { version = "1.0.0", path = "../crabwall-packet", features = ["test-util"] }
